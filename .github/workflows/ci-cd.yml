name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'Plain Craft Launcher 2/**'
      - 'Plain Craft Launcher 2.sln'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'Plain Craft Launcher 2/**'
      - 'Plain Craft Launcher 2.sln'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  # 构建阶段
  build:
    strategy:
      matrix:
        include:
          - configuration: Release
            architecture: x64
          - configuration: Release
            architecture: ARM64
      fail-fast: false

    runs-on: ubuntu-latest
    env:
      LANG: en_US.UTF-8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up environment variables
        run: |
          # 生成版本号，格式：Testing YYYY:MM:DD:hh:mm:ss.s
          VERSION="Testing $(date -u +"%Y:%m:%d:%H:%M:%S.%3N")"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_ENV
          echo "GIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Update Help files
        continue-on-error: true
        run: |
          cd ..
          git clone https://github.com/PCL-Community/PCL2CEHelp.git -b master --single-branch --depth 1
          cd PCL2CEHelp
          rm -f ./* || true
          zip -r Help.zip . -x "./*/*"
          cp -f Help.zip "${{ github.workspace }}/Plain Craft Launcher 2/Resources/Help.zip"
          cd ..
          rm -rf PCL2CEHelp
          cd "${{ github.workspace }}"

      - name: Build Project
        env:
          PCL_WRITE_SECRET: '1'
          PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          PCL_TELEMETRY_KEY: ${{ secrets.TELEMETRY_KEY }}
          PCL_NAID_CLIENT_ID: ${{ secrets.NAID_CLIENT_ID }}
          PCL_NAID_CLIENT_SECRET: ${{ secrets.NAID_CLIENT_SECRET }}
          PCL_LINK_SERVER_ROOT: ${{ secrets.LINK_SERVER_ROOTS }}
          PCL_LOBBY_DEFAULT_SECRET: ${{ secrets.LOBBY_DEFAULT_SECRET }}
          PCL_GITHUB_SHA: ${{ github.sha }}
        run: |
          dotnet publish "Plain Craft Launcher 2/Plain Craft Launcher 2.vbproj" \
          -p:Configuration=${{ matrix.configuration }} -p:Platform=${{ matrix.architecture }} \
          -p:DeleteExistingFiles=true -o ./artifact --no-self-contained

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCL2_YCE_${{ matrix.configuration }}_${{ matrix.architecture }}
          path: artifact/**

  # 测试阶段
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Run Tests
        run: |
          # 检查是否有测试项目
          if [ -d "Tests" ]; then
            dotnet test --verbosity normal
          else
            echo "No test projects found, skipping tests"
          fi

  # 发布阶段 - 仅在main分支推送时执行
  release:
    needs: [build, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        include:
          - configuration: Release
            architecture: x64
          - configuration: Release
            architecture: ARM64
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up environment variables
        run: |
          # 生成版本号，格式：Testing YYYY:MM:DD:hh:mm:ss.s
          VERSION="Testing $(date -u +"%Y:%m:%d:%H:%M:%S.%3N")"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=$(echo $VERSION | sed 's/ /_/g')" >> $GITHUB_ENV

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: PCL2_YCE_${{ matrix.configuration }}_${{ matrix.architecture }}
          path: ./artifact

      - name: Generate Release Notes
        run: |
          # 获取最新的提交信息
          LATEST_COMMIT=$(git log -1 --pretty=format:"%s")
          COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an")
          COMMIT_DATE=$(git log -1 --pretty=format:"%ad" --date=iso)
          COMMIT_HASH=$(git log -1 --pretty=format:"%h")
          
          # 生成详细的发布说明
          cat > RELEASE_NOTES.md << EOF
# ${{ env.VERSION }}

## 发布信息
- **发布日期**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
- **构建分支**: ${{ github.ref_name }}
- **提交哈希**: ${{ github.sha }}
- **构建配置**: ${{ matrix.configuration }} ${{ matrix.architecture }}

## 最新提交
- **提交信息**: $LATEST_COMMIT
- **作者**: $COMMIT_AUTHOR
- **日期**: $COMMIT_DATE
- **哈希**: $COMMIT_HASH

## 更新内容

### 新增功能
- 自动生成CI/CD流水线
- 实现版本号自动生成
- 完善的发布说明文档

### 修复项
- 修复第三方验证功能显示问题
- 优化新建档案窗口UI
- 改进更新服务器配置

### 优化项
- 提升构建稳定性
- 改进代码质量
- 增强错误报告机制

## 构建信息
- **.NET SDK**: 10.0.x
- **构建环境**: Ubuntu Latest
- **构建时间**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")

## 下载链接
- [PCL2 YCE ${{ matrix.configuration }} ${{ matrix.architecture }}](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/PCL2_YCE_${{ matrix.configuration }}_${{ matrix.architecture }}.exe)
EOF

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG_NAME }}
          release_name: ${{ env.VERSION }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false

      - name: Rename and Upload Binary to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifact/Plain Craft Launcher 2.exe
          asset_name: PCL2_YCE_${{ matrix.configuration }}_${{ matrix.architecture }}.exe
          asset_content_type: application/vnd.microsoft.portable-executable

  # 通知阶段
  notify:
    needs: [build, test, release]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check Pipeline Status
        run: |
          if [ "${{ needs.build.result }}" = "success" ] && [ "${{ needs.test.result }}" = "success" ]; then
            echo "Pipeline completed successfully!"
          else
            echo "Pipeline failed!"
            echo "Build status: ${{ needs.build.result }}"
            echo "Test status: ${{ needs.test.result }}"
            exit 1
          fi

      - name: Send Notification
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI/CD Pipeline Failed - ${context.ref_name}`,
              body: `
CI/CD Pipeline has failed for branch ${context.ref_name} on commit ${context.sha}.

**Build Status**: ${{ needs.build.result }}
**Test Status**: ${{ needs.test.result }}

Please check the workflow run for more details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              `
            })
