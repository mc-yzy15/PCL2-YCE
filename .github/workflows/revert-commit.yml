name: Revert Specific Commit

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  revert-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.TOKEN }}

    - name: Configure Git
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"

    - name: Check if commit exists
      id: check_commit
      run: |
        if git rev-parse --quiet --verify 77627d16565637151db85768c8a8fe0da7f28ca5; then
          echo "commit_exists=true" >> $GITHUB_OUTPUT
        else
          echo "commit_exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Revert the commit
      if: steps.check_commit.outputs.commit_exists == 'true'
      run: |
        git revert --no-edit 77627d16565637151db85768c8a8fe0da7f28ca5

    - name: Push changes
      if: steps.check_commit.outputs.commit_exists == 'true'
      run: |
        git push origin dev

    - name: Create pull request if revert fails due to conflicts
      if: failure() && steps.check_commit.outputs.commit_exists == 'true'
      uses: peter-evans/create-pull-request@v6
      with:
        title: "Revert commit 77627d16565637151db85768c8a8fe0da7f28ca5"
        body: "This PR attempts to revert commit 77627d16565637151db85768c8a8fe0da7f28ca5 but encountered conflicts that need manual resolution."
        branch: revert-77627d16565637151db85768c8a8fe0da7f28ca5
        delete-branch: true
